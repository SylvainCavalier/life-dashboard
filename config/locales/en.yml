# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

# L'interface est en francais mais la locale de l'application reste :en.
# Les quelques messages de validation visibles par l'utilisateur (formulaire de
# changement de mot de passe) sont donc traduits ici.
en:
  hello: "Hello world"

  # Portee volontairement limitee au modele User : surcharger errors.messages
  # globalement changerait aussi les messages d'erreur de l'API pour tous les
  # autres modeles.
  activerecord:
    errors:
      models:
        user:
          format: "%{message}"
          attributes:
            current_password:
              blank: "Renseigne ton mot de passe actuel."
              invalid: "Le mot de passe actuel est incorrect."
            password:
              blank: "Renseigne un nouveau mot de passe."
              too_short: "Le nouveau mot de passe doit faire au moins %{count} caracteres."
            password_confirmation:
              confirmation: "La confirmation ne correspond pas au nouveau mot de passe."
